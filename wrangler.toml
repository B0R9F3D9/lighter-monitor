name = "lighter-monitor"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

minify = true

[placement]
mode = "smart"

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
run_worker_first = [
  "/webhook*",
  "/api/*",
  "/health*",
  "/setup-commands*",
  "/checker",
  "/checker/",
  "/hedge",
  "/hedge/",
]

[build]
command = "bun run --cwd apps/web build"
watch_dir = ["apps/web/src", "apps/web/app", "apps/web/public"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lighter-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[observability]
enabled = true
head_sampling_rate = 1

name = "lighter-monitor"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/*", "!/assets/*", "!/spread*", "!/analytics*", "!/checker/solo*", "!/checker/hedge*", "!/favicon*", "!/apple-touch-icon*", "!/lighter-logo.svg"]

[build]
command = "bun scripts/build_web.ts"
watch_dir = "web"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lighter-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
